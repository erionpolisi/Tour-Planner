@if (vm.isOpen()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm"
    (click)="vm.close()"
  >
    <div
      class="relative w-full max-w-2xl mx-4 p-8 rounded-2xl bg-gray-900/95 border border-white/10 shadow-2xl max-h-[90vh] overflow-y-auto"
      (click)="$event.stopPropagation()"
    >
      <button
        (click)="vm.close()"
        class="absolute top-4 right-4 w-8 h-8 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/10 transition-all"
      >
        <lucide-icon [img]="icons.X" class="w-4 h-4"></lucide-icon>
      </button>

      <h2 class="text-2xl font-bold text-white mb-6">Create Tour</h2>

      <div class="space-y-4 mb-6">
        <div>
          <label class="text-xs text-gray-400 mb-1 block">Name</label>
          <input
            type="text"
            placeholder="e.g. Alpine Adventure"
            [value]="vm.form().name"
            (input)="vm.updateField('name', $any($event.target).value)"
            class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder:text-gray-500 focus:outline-none focus:border-purple-500/50 focus:bg-white/10 transition-all"
          />
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="text-xs text-gray-400 mb-1 block">From</label>
            <input
              type="text"
              placeholder="Start city"
              [value]="vm.form().from"
              (input)="vm.updateField('from', $any($event.target).value)"
              class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder:text-gray-500 focus:outline-none focus:border-purple-500/50 focus:bg-white/10 transition-all"
            />
          </div>
          <div>
            <label class="text-xs text-gray-400 mb-1 block">To</label>
            <input
              type="text"
              placeholder="End city"
              [value]="vm.form().to"
              (input)="vm.updateField('to', $any($event.target).value)"
              class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder:text-gray-500 focus:outline-none focus:border-purple-500/50 focus:bg-white/10 transition-all"
            />
          </div>
        </div>
        <div>
          <label class="text-xs text-gray-400 mb-1 block">Map</label>
          <app-map-picker
            [from]="vm.form().from"
            [to]="vm.form().to"
            [transportType]="vm.form().transportType"
            [editable]="true"
            (fromChange)="vm.updateField('from', $event)"
            (toChange)="vm.updateField('to', $event)"
            (routeCalculated)="vm.applyRoute($event.distanceKm, $event.durationStr)"
          ></app-map-picker>
        </div>
        <div>
          <label class="text-xs text-gray-400 mb-2 block">Transport Type</label>
          <div class="flex gap-2">
            @for (type of transportTypes; track type) {
              <button
                (click)="vm.updateField('transportType', type)"
                [class]="vm.form().transportType === type
                  ? 'flex-1 flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-gradient-to-r from-purple-500/30 to-pink-500/30 border border-purple-500/40 text-white text-sm font-medium transition-all'
                  : 'flex-1 flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-gray-400 hover:text-white hover:bg-white/10 text-sm font-medium transition-all'"
              >
                <lucide-icon [img]="transportIcons[type]" class="w-4 h-4"></lucide-icon>
                <span class="capitalize">{{ type }}</span>
              </button>
            }
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="text-xs text-gray-400 mb-1 block">
              Distance (km)
              @if (vm.routeSuggestion()) {
                <span class="ml-1 text-emerald-400">• auto</span>
              }
            </label>
            <input
              type="text"
              placeholder="e.g. 300"
              [value]="vm.form().distance"
              (input)="vm.updateField('distance', $any($event.target).value)"
              [readonly]="!!vm.routeSuggestion()"
              [class]="vm.routeSuggestion()
                ? 'w-full px-4 py-3 rounded-xl bg-white/5 border border-emerald-500/30 text-white cursor-not-allowed'
                : 'w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder:text-gray-500 focus:outline-none focus:border-purple-500/50 focus:bg-white/10 transition-all'"
            />
          </div>
          <div>
            <label class="text-xs text-gray-400 mb-1 flex items-center justify-between gap-2">
              <span>Estimated Time</span>
              @if (vm.routeSuggestion(); as s) {
                <button
                  type="button"
                  (click)="vm.applyDurationSuggestion()"
                  class="text-[11px] px-2 py-0.5 rounded-md bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 hover:bg-emerald-500/25 transition-all"
                  title="Use suggested duration"
                >Use ~{{ s.durationStr }}</button>
              }
            </label>
            <div class="flex gap-2 items-center">
              <div class="flex-1 relative">
                <input
                  type="number"
                  min="0"
                  max="99"
                  [value]="getDurationHours(vm.form().duration)"
                  (input)="vm.updateField('duration', formatDuration(+$any($event.target).value, getDurationMinutes(vm.form().duration)))"
                  class="w-full px-4 py-3 pr-8 rounded-xl bg-white/5 border border-white/10 text-white focus:outline-none focus:border-purple-500/50 focus:bg-white/10 transition-all [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none"
                />
                <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-gray-500">h</span>
              </div>
              <span class="text-gray-500 font-bold">:</span>
              <div class="flex-1 relative">
                <input
                  type="number"
                  min="0"
                  max="59"
                  [value]="getDurationMinutes(vm.form().duration)"
                  (input)="vm.updateField('duration', formatDuration(getDurationHours(vm.form().duration), +$any($event.target).value))"
                  class="w-full px-4 py-3 pr-10 rounded-xl bg-white/5 border border-white/10 text-white focus:outline-none focus:border-purple-500/50 focus:bg-white/10 transition-all [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none"
                />
                <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-gray-500">min</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="flex gap-3">
        <button
          (click)="vm.save()"
          class="flex-1 px-6 py-3 rounded-xl bg-gradient-to-r from-purple-500 to-pink-500 text-white font-semibold hover:shadow-2xl hover:shadow-purple-500/50 hover:scale-[1.02] transition-all flex items-center justify-center gap-2"
        >
          <lucide-icon [img]="icons.Save" class="w-4 h-4"></lucide-icon>
          Create
        </button>
        <button
          (click)="vm.close()"
          class="px-6 py-3 rounded-xl bg-white/5 border border-white/10 text-gray-300 hover:text-white hover:bg-white/10 transition-all"
        >
          Cancel
        </button>
      </div>
    </div>
  </div>
}
