<div
  [class]="fullscreen()
    ? 'fixed inset-0 z-[100] bg-gray-900 flex flex-col'
    : 'rounded-xl overflow-hidden border border-white/10 bg-white/5 flex flex-col'"
>
  <div class="flex items-center justify-between px-3 py-2 bg-white/5 border-b border-white/10 text-xs">
    @if (editable()) {
      <div class="flex items-center gap-2">
        <span class="text-gray-400 hidden sm:inline">Click map to set:</span>
        <div class="flex gap-1 p-1 rounded-lg bg-white/5 border border-white/10">
          <button
            type="button"
            (click)="setActive('from')"
            [class]="activeMarker() === 'from'
              ? 'px-3 py-1 rounded-md bg-gradient-to-r from-purple-500/40 to-pink-500/40 border border-purple-500/40 text-white text-xs font-semibold'
              : 'px-3 py-1 rounded-md text-gray-400 hover:text-white hover:bg-white/10 text-xs font-semibold'"
          >From</button>
          <button
            type="button"
            (click)="setActive('to')"
            [class]="activeMarker() === 'to'
              ? 'px-3 py-1 rounded-md bg-gradient-to-r from-purple-500/40 to-pink-500/40 border border-purple-500/40 text-white text-xs font-semibold'
              : 'px-3 py-1 rounded-md text-gray-400 hover:text-white hover:bg-white/10 text-xs font-semibold'"
          >To</button>
        </div>
      </div>
    } @else {
      <span class="text-gray-400">Route Preview</span>
    }
    <button
      type="button"
      (click)="toggleFullscreen()"
      class="px-2 py-1 rounded-md text-gray-300 hover:text-white hover:bg-white/10 transition-all flex items-center gap-1.5"
      [title]="fullscreen() ? 'Exit fullscreen' : 'Open fullscreen'"
    >
      <lucide-icon [img]="fullscreen() ? icons.Minimize2 : icons.Maximize2" class="w-4 h-4"></lucide-icon>
      <span class="hidden sm:inline">{{ fullscreen() ? 'Close' : 'Expand' }}</span>
    </button>
  </div>
  <div
    #mapContainer
    [class]="fullscreen() ? 'w-full flex-1' : 'w-full h-80'"
  ></div>
</div>
