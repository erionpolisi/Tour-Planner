<nav class="h-16 md:h-20 backdrop-blur-xl bg-white/5 border-b border-white/10 flex items-center justify-between gap-3 px-4 md:px-8">
  <div class="flex items-center gap-3 min-w-0">
    <button
      type="button"
      (click)="layoutService.toggleSidebar()"
      title="Toggle navigation"
      aria-label="Toggle navigation"
      class="lg:hidden w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-gray-300 hover:text-white hover:bg-white/10 transition-all shrink-0"
    >
      <lucide-icon [img]="icons.Menu" class="w-5 h-5"></lucide-icon>
    </button>
    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center shrink-0">
      <lucide-icon [img]="icons.Map" class="w-6 h-6 text-white"></lucide-icon>
    </div>
    <h1 class="hidden sm:block text-xl md:text-2xl font-bold bg-gradient-to-r from-white to-gray-400 bg-clip-text text-transparent truncate">
      Tour Planner
    </h1>
  </div>
  <div class="flex items-center gap-2 md:gap-4 min-w-0">
    <div class="relative flex-1 min-w-0 sm:flex-none">
      <lucide-icon [img]="icons.Search" class="w-5 h-5 text-gray-400 absolute left-4 top-1/2 -translate-y-1/2 pointer-events-none"></lucide-icon>
      <input
        #searchInput
        type="text"
        [placeholder]="searchService.placeholder()"
        [value]="searchService.query()"
        [disabled]="!searchService.active()"
        (input)="onSearch($event)"
        class="w-full sm:w-64 md:w-80 lg:w-96 h-11 pl-14 pr-12 rounded-xl bg-white/5 border border-white/10 text-white text-left placeholder:text-gray-500 focus:outline-none focus:border-purple-500/50 focus:bg-white/10 transition-all disabled:opacity-40 disabled:cursor-not-allowed"
      />
      @if (searchService.query()) {
        <button
          type="button"
          (click)="onClear()"
          title="Clear search"
          aria-label="Clear search"
          class="absolute right-3 top-1/2 -translate-y-1/2 w-7 h-7 rounded-md bg-white/5 border border-white/10 flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/10 transition-all"
        >
          <lucide-icon [img]="icons.X" class="w-3.5 h-3.5"></lucide-icon>
        </button>
      }
    </div>
    <a routerLink="/profile" class="w-11 h-11 rounded-xl bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center cursor-pointer hover:scale-105 transition-transform shrink-0" [title]="currentUser()?.email ?? 'Profile'">
      <lucide-icon [img]="icons.User" class="w-5 h-5 text-white"></lucide-icon>
    </a>
    <button
      type="button"
      (click)="logout()"
      title="Sign out"
      class="hidden sm:flex w-11 h-11 rounded-xl bg-white/5 border border-white/10 items-center justify-center cursor-pointer hover:bg-white/10 hover:border-purple-500/40 hover:text-white text-gray-300 transition-all shrink-0"
    >
      <lucide-icon [img]="icons.LogOut" class="w-5 h-5"></lucide-icon>
    </button>
  </div>
</nav>
