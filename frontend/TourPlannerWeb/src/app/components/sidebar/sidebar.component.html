<aside class="w-72 backdrop-blur-xl bg-white/5 border-r border-white/10 p-6 overflow-y-auto min-h-0">
  <!-- Navigation -->
  <div class="space-y-2">
    @for (item of navItems; track item.label) {
      <a
        [routerLink]="item.route"
        routerLinkActive="nav-active"
        #rla="routerLinkActive"
        [class]="rla.isActive
          ? 'px-4 py-3.5 rounded-xl bg-gradient-to-r from-purple-500/20 to-pink-500/20 border border-purple-500/30 cursor-pointer flex items-center gap-3 text-white shadow-lg shadow-purple-500/20'
          : 'px-4 py-3.5 rounded-xl bg-white/5 border border-white/10 cursor-pointer hover:bg-white/10 transition-all flex items-center gap-3 text-gray-300 hover:text-white'"
      >
        <lucide-icon [img]="item.icon" class="w-5 h-5"></lucide-icon>
        <span>{{ item.label }}</span>
      </a>
    }
  </div>

  <!-- Stats Cards -->
  <div class="mt-8 space-y-3">
    @for (stat of allStats(); track stat.label) {
      <div class="p-4 rounded-xl bg-white/5 border border-white/10 backdrop-blur-sm hover:bg-white/10 transition-all cursor-pointer">
        <div class="flex items-center gap-3 mb-2">
          <div class="w-10 h-10 rounded-lg bg-gradient-to-br flex items-center justify-center"
               [class]="stat.color">
            <lucide-icon [img]="statIcons[stat.icon]" class="w-5 h-5 text-white"></lucide-icon>
          </div>
          <div class="text-xs text-gray-400">{{ stat.label }}</div>
        </div>
        <div class="text-2xl font-bold text-white">{{ stat.value }}</div>
      </div>
    }
  </div>
</aside>
