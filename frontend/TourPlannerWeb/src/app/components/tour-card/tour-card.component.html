<div (click)="onCardClick()" class="group relative p-6 rounded-2xl bg-white/5 border border-white/10 backdrop-blur-sm hover:bg-white/10 hover:border-white/20 transition-all cursor-pointer hover:scale-[1.02] hover:shadow-2xl">
  <!-- Gradient accent bar -->
  <div class="absolute top-0 left-0 right-0 h-1.5 rounded-t-2xl bg-gradient-to-r"
       [class]="tour().color"></div>

  <!-- Header -->
  <div class="flex items-start justify-between mb-4">
    <div>
      <h3 class="text-xl font-bold text-white mb-1 group-hover:text-transparent group-hover:bg-gradient-to-r group-hover:bg-clip-text group-hover:from-purple-400 group-hover:to-pink-400 transition-all">
        {{ tour().name }}
      </h3>
      <div class="flex items-center gap-2 text-sm text-gray-400">
        <lucide-icon [img]="icons.MapPin" class="w-4 h-4"></lucide-icon>
        <span>{{ tour().from }} → {{ tour().to }}</span>
      </div>
    </div>
    <div class="flex items-center gap-1 px-2.5 py-1 rounded-lg bg-yellow-500/20 border border-yellow-500/30">
      <lucide-icon [img]="icons.Star" class="w-4 h-4 text-yellow-400"></lucide-icon>
      <span class="text-sm font-semibold text-yellow-400">{{ tour().rating }}</span>
    </div>
  </div>

  <!-- Stats -->
  <div class="grid grid-cols-2 gap-3 mb-4">
    <div class="p-3 rounded-xl bg-white/5 border border-white/10">
      <div class="text-xs text-gray-400 mb-1">Distance</div>
      <div class="text-lg font-bold text-white">{{ tour().distance }} km</div>
    </div>
    <div class="p-3 rounded-xl bg-white/5 border border-white/10">
      <div class="flex items-center gap-1 text-xs text-gray-400 mb-1">
        <lucide-icon [img]="icons.Clock" class="w-3 h-3"></lucide-icon>
        <span>Duration</span>
      </div>
      <div class="text-lg font-bold text-white">{{ tour().duration }}</div>
    </div>
  </div>

  <!-- Actions -->
  <div class="flex gap-2">
    <button (click)="onEdit($event)" class="flex-1 px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white hover:bg-white/10 transition-all flex items-center justify-center gap-2 group-hover:border-purple-500/30">
      <lucide-icon [img]="icons.Edit2" class="w-4 h-4"></lucide-icon>
      <span class="text-sm font-medium">Edit</span>
    </button>
    <button
      (click)="onDelete($event)"
      class="px-4 py-2.5 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 hover:bg-red-500/20 transition-all flex items-center justify-center">
      <lucide-icon [img]="icons.Trash2" class="w-4 h-4"></lucide-icon>
    </button>
  </div>
</div>
