<div class="min-h-screen w-full bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 flex items-center justify-center p-6">
  <div class="w-full max-w-md">
    <!-- Brand -->
    <div class="flex items-center justify-center gap-3 mb-8">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center shadow-lg shadow-purple-500/30">
        <lucide-icon [img]="icons.Map" class="w-6 h-6 text-white"></lucide-icon>
      </div>
      <h1 class="text-2xl font-bold text-white">Tour Planner</h1>
    </div>

    <!-- Card -->
    <div class="p-8 rounded-2xl bg-white/5 border border-white/10 backdrop-blur-sm">
      <h2 class="text-xl font-semibold text-white mb-1">
        {{ vm.isLogin() ? 'Welcome back' : 'Create your account' }}
      </h2>
      <p class="text-sm text-gray-400 mb-6">
        {{ vm.isLogin() ? 'Sign in to plan your next adventure.' : 'Start tracking your tours in minutes.' }}
      </p>

      <!-- Mode tabs -->
      <div class="flex gap-2 p-1 mb-6 rounded-xl bg-white/5 border border-white/10">
        <button
          type="button"
          (click)="vm.setMode('login')"
          [class]="vm.isLogin()
            ? 'flex-1 py-2 rounded-lg bg-gradient-to-r from-purple-500 to-pink-500 text-white text-sm font-semibold transition-all'
            : 'flex-1 py-2 rounded-lg text-gray-400 text-sm font-medium hover:text-white transition-all'"
        >
          Sign in
        </button>
        <button
          type="button"
          (click)="vm.setMode('register')"
          [class]="!vm.isLogin()
            ? 'flex-1 py-2 rounded-lg bg-gradient-to-r from-purple-500 to-pink-500 text-white text-sm font-semibold transition-all'
            : 'flex-1 py-2 rounded-lg text-gray-400 text-sm font-medium hover:text-white transition-all'"
        >
          Sign up
        </button>
      </div>

      <!-- Form -->
      <form (submit)="$event.preventDefault(); vm.submit()" class="space-y-4">
        @if (!vm.isLogin()) {
          <div>
            <label class="flex items-center gap-2 text-xs text-gray-400 mb-2">
              <lucide-icon [img]="icons.User" class="w-3 h-3"></lucide-icon>
              Name
            </label>
            <input
              type="text"
              autocomplete="name"
              [value]="vm.form().name"
              (input)="vm.updateField('name', $any($event.target).value)"
              class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder:text-gray-500 focus:outline-none focus:border-purple-500/50 focus:bg-white/10 transition-all"
              placeholder="Jane Doe"
            />
          </div>
        }

        <div>
          <label class="flex items-center gap-2 text-xs text-gray-400 mb-2">
            <lucide-icon [img]="icons.Mail" class="w-3 h-3"></lucide-icon>
            Email
          </label>
          <input
            type="email"
            autocomplete="email"
            [value]="vm.form().email"
            (input)="vm.updateField('email', $any($event.target).value)"
            class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder:text-gray-500 focus:outline-none focus:border-purple-500/50 focus:bg-white/10 transition-all"
            placeholder="you@example.com"
          />
        </div>

        <div>
          <label class="flex items-center gap-2 text-xs text-gray-400 mb-2">
            <lucide-icon [img]="icons.Lock" class="w-3 h-3"></lucide-icon>
            Password
          </label>
          <input
            type="password"
            [attr.autocomplete]="vm.isLogin() ? 'current-password' : 'new-password'"
            [value]="vm.form().password"
            (input)="vm.updateField('password', $any($event.target).value)"
            class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder:text-gray-500 focus:outline-none focus:border-purple-500/50 focus:bg-white/10 transition-all"
            placeholder="••••••••"
          />
        </div>

        @if (vm.error(); as err) {
          <div class="flex items-start gap-2 p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-sm text-red-300">
            <lucide-icon [img]="icons.AlertCircle" class="w-4 h-4 mt-0.5 shrink-0"></lucide-icon>
            <span>{{ err }}</span>
          </div>
        }

        <button
          type="submit"
          [disabled]="vm.submitting()"
          class="w-full px-6 py-3 rounded-xl bg-gradient-to-r from-purple-500 to-pink-500 text-white font-semibold hover:shadow-2xl hover:shadow-purple-500/50 hover:scale-[1.01] transition-all disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:scale-100"
        >
          {{ vm.submitting() ? 'Please wait…' : vm.submitLabel() }}
        </button>
      </form>

      <button
        type="button"
        (click)="vm.toggleMode()"
        class="block w-full mt-4 text-center text-sm text-gray-400 hover:text-white transition-colors"
      >
        {{ vm.toggleLabel() }}
      </button>
    </div>
  </div>
</div>
