<main class="flex-1 p-8 overflow-y-auto min-h-0">
  <!-- Header -->
  <div class="mb-8">
    <h2 class="text-3xl font-bold text-white mb-1">Profile</h2>
    <p class="text-gray-400">Manage your account settings</p>
  </div>

  <!-- Profile Card -->
  <div class="max-w-xl p-8 rounded-2xl bg-white/5 border border-white/10 backdrop-blur-sm">
    <!-- Avatar -->
    <div class="flex items-center gap-6 mb-8">
      <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center">
        <lucide-icon [img]="icons.User" class="w-10 h-10 text-white"></lucide-icon>
      </div>
      <div>
        <h3 class="text-xl font-bold text-white">{{ vm.profile().name }}</h3>
        <p class="text-gray-400">{{ vm.profile().email }}</p>
      </div>
    </div>

    @if (!vm.editing()) {
      <!-- View Mode -->
      <div class="space-y-4">
        <div class="p-4 rounded-xl bg-white/5 border border-white/10">
          <div class="flex items-center gap-2 text-xs text-gray-400 mb-1">
            <lucide-icon [img]="icons.User" class="w-3 h-3"></lucide-icon>
            Name
          </div>
          <div class="text-white font-medium">{{ vm.profile().name }}</div>
        </div>
        <div class="p-4 rounded-xl bg-white/5 border border-white/10">
          <div class="flex items-center gap-2 text-xs text-gray-400 mb-1">
            <lucide-icon [img]="icons.Mail" class="w-3 h-3"></lucide-icon>
            Email
          </div>
          <div class="text-white font-medium">{{ vm.profile().email }}</div>
        </div>
      </div>
      <button
        (click)="vm.startEdit()"
        class="mt-6 px-6 py-3 rounded-xl bg-gradient-to-r from-purple-500 to-pink-500 text-white font-semibold hover:shadow-2xl hover:shadow-purple-500/50 hover:scale-105 transition-all flex items-center gap-2"
      >
        <lucide-icon [img]="icons.Edit2" class="w-4 h-4"></lucide-icon>
        Edit Profile
      </button>
    } @else {
      <!-- Edit Mode -->
      <div class="space-y-4">
        <div>
          <label class="flex items-center gap-2 text-xs text-gray-400 mb-2">
            <lucide-icon [img]="icons.User" class="w-3 h-3"></lucide-icon>
            Name
          </label>
          <input
            type="text"
            [value]="vm.editForm().name"
            (input)="vm.updateField('name', $any($event.target).value)"
            class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder:text-gray-500 focus:outline-none focus:border-purple-500/50 focus:bg-white/10 transition-all"
          />
        </div>
        <div>
          <label class="flex items-center gap-2 text-xs text-gray-400 mb-2">
            <lucide-icon [img]="icons.Mail" class="w-3 h-3"></lucide-icon>
            Email
          </label>
          <input
            type="email"
            [value]="vm.editForm().email"
            (input)="vm.updateField('email', $any($event.target).value)"
            class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder:text-gray-500 focus:outline-none focus:border-purple-500/50 focus:bg-white/10 transition-all"
          />
        </div>
      </div>
      <div class="mt-6 flex gap-3">
        <button
          (click)="vm.saveEdit()"
          class="px-6 py-3 rounded-xl bg-gradient-to-r from-purple-500 to-pink-500 text-white font-semibold hover:shadow-2xl hover:shadow-purple-500/50 hover:scale-105 transition-all flex items-center gap-2"
        >
          <lucide-icon [img]="icons.Save" class="w-4 h-4"></lucide-icon>
          Save
        </button>
        <button
          (click)="vm.cancelEdit()"
          class="px-6 py-3 rounded-xl bg-white/5 border border-white/10 text-gray-300 hover:text-white hover:bg-white/10 transition-all flex items-center gap-2"
        >
          <lucide-icon [img]="icons.X" class="w-4 h-4"></lucide-icon>
          Cancel
        </button>
      </div>
    }
  </div>
</main>
